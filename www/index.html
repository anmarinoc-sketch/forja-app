<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FORJA · Registro de fuerza</title>
<meta name="theme-color" content="#16161A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORJA">
<script src="vendor/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#16161A;
  --surface:#201F24;
  --surface-2:#28272D;
  --border:#34333A;
  --ember:#E8623F;
  --ember-dim:#B84E33;
  --steel:#5B8A9A;
  --steel-dim:#3E606C;
  --text:#EDEAE4;
  --text-muted:#93909A;
  --success:#8AA66B;
  --warning:#E0A83E;
  --font-display:'Bebas Neue', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
  --nav-bg:rgba(22,22,26,0.92);
}
body.light{
  --bg:#F2F0EC;
  --surface:#FFFFFF;
  --surface-2:#EDEAE3;
  --border:#DDD8CE;
  --ember:#D9552E;
  --ember-dim:#B84E33;
  --steel:#3E7185;
  --steel-dim:#2F5A69;
  --text:#1E1C1A;
  --text-muted:#6B6660;
  --success:#5F8A47;
  --warning:#B5791A;
  --nav-bg:rgba(242,240,236,0.92);
}
body{transition:background-color .2s ease, color .2s ease;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at top, rgba(232,98,63,0.06), transparent 55%),
    repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 8px),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#root{max-width:560px;margin:0 auto;padding-bottom:92px;min-height:100vh;}

::selection{background:var(--ember);color:#16161A;}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;}

/* ---------- Topbar ---------- */
.topbar{
  padding:22px 20px 14px;
  display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.brand{font-family:var(--font-display);font-size:32px;letter-spacing:1px;color:var(--text);line-height:1;}
.brand span{color:var(--ember);}
.tagline{font-size:11px;color:var(--text-muted);letter-spacing:0.4px;margin-top:2px;}
.theme-toggle{
  background:var(--surface-2);border:1px solid var(--border);border-radius:20px;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  color:var(--text);cursor:pointer;flex-shrink:0;
}
.theme-toggle svg{width:18px;height:18px;}

/* ---------- Layout helpers ---------- */
.view{padding:16px 16px 8px;animation:fadeIn .25s ease;}
@media (prefers-reduced-motion: reduce){.view{animation:none;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.section-title{
  font-family:var(--font-display);
  font-size:20px;letter-spacing:0.5px;color:var(--text);
  margin:18px 0 10px;
}
.section-title:first-child{margin-top:2px;}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px;
  margin-bottom:14px;
}

/* ---------- Form fields ---------- */
.field{margin-bottom:14px;}
.field label{
  display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.6px;
  color:var(--text-muted);margin-bottom:6px;font-weight:600;
}
select, input[type=number], input[type=text], textarea{
  width:100%;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  padding:11px 12px;
  border-radius:8px;
  appearance:none;
  -webkit-appearance:none;
}
select{
  background-image:linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position:calc(100% - 18px) center, calc(100% - 13px) center;
  background-size:5px 5px, 5px 5px;
  background-repeat:no-repeat;
  padding-right:34px;
}
textarea{resize:vertical;min-height:80px;font-family:var(--font-body);}
input[type=number]{font-family:var(--font-mono);font-size:20px;font-weight:600;}
.row{display:flex;gap:10px;}
.row > .field{flex:1;}

.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface-2);width:fit-content;}
.stepper button{
  width:42px;height:42px;background:transparent;border:none;color:var(--text);
  font-size:20px;cursor:pointer;font-family:var(--font-body);
}
.stepper button:active{background:var(--ember-dim);}
.stepper .val{width:52px;text-align:center;font-family:var(--font-mono);font-size:17px;font-weight:600;}

.hint{font-size:12.5px;color:var(--text-muted);margin-top:4px;}
.hint b{color:var(--text);font-weight:600;}

/* ---------- Buttons ---------- */
.btn{
  font-family:var(--font-display);
  font-size:16px;letter-spacing:0.8px;
  padding:13px 18px;border-radius:8px;border:none;cursor:pointer;width:100%;
  text-transform:uppercase;
}
.btn-primary{background:var(--ember);color:#16161A;}
.btn-primary:active{background:var(--ember-dim);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted);}
.btn-ghost:active{border-color:var(--steel);color:var(--text);}
.btn-danger{background:transparent;border:1px solid var(--border);color:#C97867;}

/* ---------- Plate visualizer ---------- */
.plate-viz{background:var(--surface-2);border-radius:8px;padding:8px 4px;text-align:center;}
.plate-label{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);margin-top:2px;}
.plate-empty{background:var(--surface-2);border-radius:8px;padding:18px 12px;text-align:center;color:var(--text-muted);font-size:12.5px;}

/* ---------- Motivation banner ---------- */
.banner{
  background:linear-gradient(120deg, rgba(232,98,63,0.14), rgba(91,138,154,0.10));
  border:1px solid var(--border);
  border-left:3px solid var(--ember);
  border-radius:8px;
  padding:14px 16px;
  margin-bottom:16px;
  font-size:14.5px;
  line-height:1.45;
}
.banner b{font-family:var(--font-display);letter-spacing:0.3px;font-size:15px;}

/* ---------- Session list ---------- */
.session-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.session-item:last-child{border-bottom:none;}
.session-main{font-size:14px;}
.session-main .ex{font-weight:600;}
.session-meta{font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.chip{
  display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:20px;
  background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);
  margin-left:6px;text-transform:uppercase;letter-spacing:0.3px;
}
.del-btn{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:4px 8px;}
.del-btn:active{color:#C97867;}

/* ---------- Stats grid ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 8px;text-align:center;}
.stat-val{font-family:var(--font-mono);font-size:19px;font-weight:700;color:var(--ember);}
.stat-lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-top:3px;}

.empty-state{text-align:center;color:var(--text-muted);font-size:13.5px;padding:26px 12px;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--nav-bg);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  display:flex;max-width:560px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;background:none;border:none;color:var(--text-muted);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 4px 8px;font-family:var(--font-body);font-size:10.5px;cursor:pointer;
  letter-spacing:0.3px;
}
.nav-btn.active{color:var(--ember);}
.nav-btn svg{width:21px;height:21px;}

.chart-wrap{position:relative;height:210px;margin-bottom:6px;}
.chart-wrap.small{height:150px;}

.recommend-box{
  background:var(--surface-2);border-radius:8px;padding:12px 14px;
  font-size:13.5px;line-height:1.5;margin-top:4px;
  border-left:3px solid var(--steel);
}
.recommend-box b{color:var(--steel);font-family:var(--font-display);letter-spacing:0.3px;font-size:13px;}

.loading-screen{
  display:flex;align-items:center;justify-content:center;height:100vh;
  color:var(--text-muted);font-family:var(--font-mono);font-size:13px;
}

.history-day{margin-bottom:18px;}
.history-day-label{font-family:var(--font-display);font-size:15px;letter-spacing:0.4px;color:var(--steel);margin-bottom:6px;}

/* ---------- Calendario ---------- */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-header .cal-month{font-family:var(--font-display);font-size:17px;letter-spacing:0.4px;text-transform:capitalize;}
.cal-nav-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;width:32px;height:32px;color:var(--text);font-size:16px;cursor:pointer;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:10px;color:var(--text-muted);text-transform:uppercase;padding-bottom:4px;}
.cal-day{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:6px;font-family:var(--font-mono);font-size:12px;color:var(--text);
  background:var(--surface-2);cursor:pointer;position:relative;border:1px solid transparent;
}
.cal-day.empty{background:transparent;cursor:default;}
.cal-day.today{border-color:var(--steel);}
.cal-day.trained{background:var(--ember);color:#16161A;font-weight:700;}
.cal-day.selected{outline:2px solid var(--steel);outline-offset:1px;}
.cal-legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);margin-top:10px;}
.cal-legend .dot{width:10px;height:10px;border-radius:3px;background:var(--ember);display:inline-block;}

/* ---------- Editor de rutina ---------- */
.routine-day-card{margin-bottom:14px;}
.routine-day-title{font-family:var(--font-display);font-size:16px;letter-spacing:0.3px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.routine-ex-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.routine-ex-row:last-of-type{border-bottom:none;}
.routine-ex-name{font-size:14px;}
.routine-ex-muscle{font-size:11px;color:var(--text-muted);margin-top:1px;}
.add-day-btn{width:100%;margin-top:4px;}
</style>
</head>
<body>
<div id="root"><div class="loading-screen">Cargando tu progreso…</div></div>

<script>
/* ============ DATA MODEL ============ */
const DEFAULT_ROUTINE = {
  '1': { label:'Día 1 · Torso', exercises:[
    {name:'Curl bíceps con barra Z', muscle:'Bíceps'},
    {name:'Extensión unilateral tríceps', muscle:'Tríceps'},
    {name:'Curl predicador unilateral', muscle:'Bíceps'},
    {name:'Press francés con mancuernas', muscle:'Tríceps'},
    {name:'Vuelos laterales', muscle:'Hombros'},
    {name:'Dominada pronada en barra', muscle:'Espalda'},
    {name:'Press plano con mancuernas (Cruce 5 hueco)', muscle:'Pecho'},
    {name:'Remo unilateral en polea (4 hueco)', muscle:'Espalda'},
    {name:'Fondos en paralelas', muscle:'Tríceps'},
    {name:'ABS (Crunch en polea)', muscle:'Abdomen'},
  ]},
  '2': { label:'Día 2 · Pierna', exercises:[
    {name:'Gemelos en máquina Smith', muscle:'Gemelos'},
    {name:'Extensión rodilla en máquina', muscle:'Cuádriceps'},
    {name:'Curl isquios tumbado', muscle:'Isquiotibiales'},
    {name:'Sentadilla Hack', muscle:'Cuádriceps'},
    {name:'Aducción cadera en máquina', muscle:'Aductores'},
    {name:'Flexión muñeca (Antebrazo)', muscle:'Antebrazo'},
    {name:'Extensión muñeca (Antebrazo)', muscle:'Antebrazo'},
  ]},
  '3': { label:'Día 3 · Torso', exercises:[
    {name:'Curl bayesian unilateral en polea', muscle:'Bíceps'},
    {name:'Katana tríceps en polea', muscle:'Tríceps'},
    {name:'Curl predicador unilateral', muscle:'Bíceps'},
    {name:'Extensión polea tríceps con barra', muscle:'Tríceps'},
    {name:'Vuelos unilaterales polea', muscle:'Hombros'},
    {name:'Dominada pronada en barra', muscle:'Espalda'},
    {name:'Press inclinado con mancuernas', muscle:'Pecho'},
    {name:'Remo unilateral en polea', muscle:'Espalda'},
    {name:'Cruce de poleas (Pectoral)', muscle:'Pecho'},
    {name:'ABS (Crunch en polea)', muscle:'Abdomen'},
  ]},
  '4': { label:'Día 4 · Pierna', exercises:[
    {name:'Gemelos en máquina Smith', muscle:'Gemelos'},
    {name:'Curl isquios sentado', muscle:'Isquiotibiales'},
    {name:'Extensión rodilla unilateral en máquina', muscle:'Cuádriceps'},
    {name:'Prensa', muscle:'Cuádriceps'},
    {name:'Aperturas invertidas en polea (Hombro posterior)', muscle:'Hombros'},
  ]},
};
const SET_TYPES = ['Normal','Calentamiento','Al fallo','Descendente'];
const RPE_OPTIONS = ['6','6.5','7','7.5','8','8.5','9','9.5','10'];

function exToMuscleMap(){
  const m = {};
  Object.values(state.routine).forEach(d=>d.exercises.forEach(e=>{ m[e.name]=e.muscle; }));
  return m;
}

function allExercisesFlat(){
  const seen = new Map();
  Object.entries(state.routine).forEach(([day,d])=>{
    d.exercises.forEach(e=>{ if(!seen.has(e.name)) seen.set(e.name, e.muscle); });
  });
  return Array.from(seen.entries()).map(([name,muscle])=>({name,muscle}));
}
function routineMuscles(){
  const set = new Set();
  Object.values(state.routine).forEach(d=>d.exercises.forEach(e=>set.add(e.muscle)));
  return Array.from(set).sort();
}

/* ============ STATE ============ */
const state = {
  loaded:false,
  sets:[], bodyWeights:[], nutrition:[],
  routine: JSON.parse(JSON.stringify(DEFAULT_ROUTINE)),
  theme:'dark',
  activeTab:'log',
  logDay:'1', logExercise: DEFAULT_ROUTINE['1'].exercises[0].name,
  logWeight:'', logUnit:'kg', logReps:10, logSetType:'Normal', logRPE:'',
  progressExercise:null, displayUnit:'kg', progressView:'exercise',
  bwWeight:'', bwUnit:'kg',
  nutritionText:'', nutritionCalories:'', nutritionProtein:'', nutritionDayType:'',
  goalType:'maintenance', goalIntensity:'moderado', maintenanceCals:'',
  calMonth: (()=>{ const d=new Date(); d.setDate(1); return d; })(),
  calSelected:null,
  newExName:{}, newExMuscle:{}, newDayLabel:'',
};

let charts = {};

/* ============ UTIL ============ */
function toKg(v,unit){ v=parseFloat(v)||0; return unit==='kg'? v : v*0.453592; }
function fromKg(vKg,unit){ return unit==='kg'? vKg : vKg*2.20462; }
function fmt(v){ return (Math.round(v*10)/10).toString(); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateFromStr(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function diffDays(a,b){ return Math.round((dateFromStr(b)-dateFromStr(a))/86400000); }
function shortDate(s){ const d=dateFromStr(s); return d.getDate()+'/'+(d.getMonth()+1); }
function relativeDate(s){
  const diff = diffDays(s, todayStr());
  if(diff===0) return 'hoy';
  if(diff===1) return 'ayer';
  return 'hace '+diff+' días';
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function hexToRgb(h){ const n=parseInt(h.slice(1),16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
function interpColor(h1,h2,t){ const c1=hexToRgb(h1),c2=hexToRgb(h2); const r=Math.round(c1.r+(c2.r-c1.r)*t),g=Math.round(c1.g+(c2.g-c1.g)*t),b=Math.round(c1.b+(c2.b-c1.b)*t); return 'rgb('+r+','+g+','+b+')'; }

/* ============ STORAGE ============ */
/* Usa window.storage (disponible dentro del chat de Claude) cuando existe;
   si no (app instalada, hosteada, o el .apk), usa localStorage del navegador. */
const hasCloudStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
async function storageGetRaw(key){
  if(hasCloudStorage){
    try{ const res = await window.storage.get(key, false); return res ? res.value : null; }catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSetRaw(key, value){
  if(hasCloudStorage){
    try{ await window.storage.set(key, value, false); return true; }catch(e){ return false; }
  }
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}

let saveTimer=null;
async function loadData(){
  try{
    const raw = await storageGetRaw('forja-data');
    if(raw){
      const p = JSON.parse(raw);
      state.sets = p.sets||[];
      state.bodyWeights = p.bodyWeights||[];
      state.nutrition = p.nutrition||[];
      if(p.goalType) state.goalType = p.goalType;
      if(p.goalIntensity) state.goalIntensity = p.goalIntensity;
      if(p.maintenanceCals) state.maintenanceCals = p.maintenanceCals;
      if(p.routine) state.routine = p.routine;
      if(p.theme) state.theme = p.theme;
    }
  }catch(e){ /* sin datos previos todavía */ }
  document.body.classList.toggle('light', state.theme==='light');
  state.loaded = true;
  renderApp();
}
function saveData(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const payload = {
      sets:state.sets, bodyWeights:state.bodyWeights, nutrition:state.nutrition,
      goalType:state.goalType, goalIntensity:state.goalIntensity, maintenanceCals:state.maintenanceCals,
      routine:state.routine, theme:state.theme,
    };
    const ok = await storageSetRaw('forja-data', JSON.stringify(payload));
    if(!ok) console.error('No se pudo guardar');
  }, 250);
}

/* ============ DERIVED DATA ============ */
function getPRBefore(exercise, beforeIndexTime){
  const rel = state.sets.filter(s=>s.exercise===exercise && s.ts < beforeIndexTime);
  if(!rel.length) return null;
  return Math.max(...rel.map(s=>s.weightKg));
}
function getPR(exercise){
  const rel = state.sets.filter(s=>s.exercise===exercise);
  if(!rel.length) return null;
  return Math.max(...rel.map(s=>s.weightKg));
}
function getLastSet(exercise){
  const rel = state.sets.filter(s=>s.exercise===exercise).sort((a,b)=>b.ts-a.ts);
  return rel[0]||null;
}
function computeStreak(){
  const dates = new Set(state.sets.map(s=>s.date));
  let streak=0;
  let cursor = new Date();
  if(!dates.has(todayStr())) cursor.setDate(cursor.getDate()-1);
  while(true){
    const ds = cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')+'-'+String(cursor.getDate()).padStart(2,'0');
    if(dates.has(ds)){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
  }
  return streak;
}
function totalVolumeKg(exercise){
  return state.sets.filter(s=>s.exercise===exercise).reduce((a,s)=>a+s.weightKg*s.reps,0);
}
function getRecommendation(exercise){
  const rel = state.sets.filter(s=>s.exercise===exercise);
  const byDate={};
  rel.forEach(s=>{ byDate[s.date]=Math.max(byDate[s.date]||0, s.weightKg); });
  const dates = Object.keys(byDate).sort();
  const last = dates.slice(-4).map(d=>byDate[d]);
  if(last.length<2) return {trend:'nodata', text:'Registra al menos 2 sesiones de este ejercicio para ver una recomendación personalizada.'};
  const flat = last.every(v=>Math.abs(v-last[0])<0.01);
  const increasing = last.every((v,i)=> i===0 || v>=last[i-1]-0.01) && last[last.length-1] > last[0]+0.01;
  const decreasing = last.every((v,i)=> i===0 || v<=last[i-1]+0.01) && last[last.length-1] < last[0]-0.01;
  if(flat && last.length>=3) return {trend:'plateau', text:'Llevas varias sesiones con el mismo peso. Prueba subir un poco (2.5–5%) o sumar una repetición más antes de aumentar la carga.'};
  if(increasing) return {trend:'up', text:'Vas progresando de forma constante en este ejercicio. Mantén la técnica y respeta el descanso entre sesiones.'};
  if(decreasing) return {trend:'down', text:'El peso bajó frente a sesiones anteriores. Puede ser fatiga acumulada — revisa tu descanso, hidratación y alimentación.'};
  return {trend:'variable', text:'Tu carga varía entre sesiones. Intenta registrar cada sesión para ver una tendencia más clara.'};
}
function getMotivation(){
  const todaySets = state.sets.filter(s=>s.date===todayStr());
  if(todaySets.length){
    const prToday = todaySets.some(s=> s.weightKg >= (getPRBefore(s.exercise, s.ts) ?? -Infinity) && getPRBefore(s.exercise, s.ts)!==null);
    if(prToday) return {title:'Nuevo récord', text:'Superaste tu marca anterior hoy. Así se construye el progreso, serie a serie.'};
    return {title:'Sesión en curso', text:'Llevas '+todaySets.length+' serie'+(todaySets.length===1?'':'s')+' registrada'+(todaySets.length===1?'':'s')+' hoy. Sigue así hasta cerrar el entrenamiento.'};
  }
  const streak = computeStreak();
  if(streak>=3) return {title:'Racha activa', text:'Llevas '+streak+' días seguidos entrenando. No la rompas hoy.'};
  if(!state.sets.length) return {title:'Primer registro', text:'Registra tu primera serie para empezar a ver tu progreso real, no solo sentirlo.'};
  const lastDate = state.sets.map(s=>s.date).sort().pop();
  const days = diffDays(lastDate, todayStr());
  if(days>=3) return {title:'Toca volver', text:'Han pasado '+days+' días desde tu última sesión. Tu cuerpo está listo para retomar.'};
  return {title:'Hoy toca', text:'Cada serie registrada es una prueba real de tu progreso. Vamos con la sesión de hoy.'};
}
function weeklyVolumeByMuscle(){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-6);
  const cutoffStr = cutoff.getFullYear()+'-'+String(cutoff.getMonth()+1).padStart(2,'0')+'-'+String(cutoff.getDate()).padStart(2,'0');
  const totals={};
  state.sets.filter(s=>s.date>=cutoffStr).forEach(s=>{
    const vol = fromKg(s.weightKg, state.displayUnit) * s.reps;
    totals[s.muscle] = (totals[s.muscle]||0) + vol;
  });
  return totals;
}
function estimate1RMKg(weightKg, reps){
  if(!weightKg || !reps) return 0;
  if(reps<=1) return weightKg;
  return weightKg * (1 + reps/30); // fórmula de Epley
}
function current1RM(exercise){
  const rel = state.sets.filter(s=>s.exercise===exercise);
  if(!rel.length) return null;
  return Math.max(...rel.map(s=>estimate1RMKg(s.weightKg, s.reps)));
}
function weeklyTotalVolumeSeries(weeksBack){
  weeksBack = weeksBack || 10;
  const today = new Date();
  const labels = [], values = [];
  for(let i=weeksBack-1; i>=0; i--){
    const end = new Date(today); end.setDate(end.getDate() - i*7);
    const start = new Date(end); start.setDate(start.getDate()-6);
    const startS = ymdFromDate(start), endS = ymdFromDate(end);
    const vol = state.sets.filter(s=>s.date>=startS && s.date<=endS)
      .reduce((a,s)=>a+fromKg(s.weightKg,state.displayUnit)*s.reps,0);
    labels.push(start.getDate()+'/'+(start.getMonth()+1));
    values.push(Math.round(vol));
  }
  return {labels, values};
}

/* ============ NUTRICIÓN: META Y ANÁLISIS ============ */
const INTENSITY_FACTORS = {
  deficit:  { leve:0.90, moderado:0.80, agresivo:0.75 },
  surplus:  { leve:1.10, moderado:1.15, agresivo:1.20 },
};
const GOAL_LABELS = { maintenance:'Mantenimiento', deficit:'Déficit', surplus:'Superávit' };
const INTENSITY_LABELS = { leve:'leve', moderado:'moderado', agresivo:'agresivo' };

function computeTargetCals(){
  const maint = parseFloat(state.maintenanceCals);
  if(!maint || maint<=0) return null;
  if(state.goalType==='maintenance') return Math.round(maint);
  const factor = INTENSITY_FACTORS[state.goalType][state.goalIntensity];
  return Math.round(maint*factor);
}
function dailyCalorieTotals(){
  const totals = {};
  state.nutrition.forEach(n=>{
    if(n.calories){ totals[n.date] = (totals[n.date]||0) + n.calories; }
  });
  return totals;
}
function dayTypeFromCals(cals){
  const target = computeTargetCals();
  if(!target || !cals) return null;
  const diff = cals - target;
  if(Math.abs(diff) <= target*0.05) return 'maintenance';
  return diff < 0 ? 'deficit' : 'surplus';
}
function nutritionWeeklyStats(){
  const target = computeTargetCals();
  const totals = dailyCalorieTotals();
  const dates = Object.keys(totals).sort();
  if(!dates.length) return {target, avg:null, diff:null};
  const last = dates.slice(-7);
  const avg = last.reduce((a,d)=>a+totals[d],0)/last.length;
  const diff = target!==null ? Math.round(avg-target) : null;
  return {target, avg: Math.round(avg), diff};
}
function getNutritionRecommendation(){
  const {target, avg, diff} = nutritionWeeklyStats();
  if(!target) return {text:'Configura tus calorías de mantenimiento arriba para que la app compare lo que comes con tu meta.'};
  if(avg===null) return {text:'Registra las calorías de al menos un día para ver cómo vas frente a tu meta de '+target+' kcal.'};
  const pct = Math.abs(diff)/target;
  if(pct<=0.05) return {text:'En promedio estás muy cerca de tu meta ('+target+' kcal). Vas bien encaminado.'};
  if(state.goalType==='deficit'){
    if(diff>0) return {text:'Tu promedio (~'+avg+' kcal) está por encima de tu meta de déficit. Revisa porciones o snacks entre comidas.'};
    if(pct>0.15) return {text:'Tu déficit promedio está siendo más agresivo de lo planeado (~'+Math.abs(diff)+' kcal por debajo). Cuida no restringir de más — la energía y el rendimiento en el gimnasio también importan.'};
    return {text:'Vas en déficit de forma consistente (~'+Math.abs(diff)+' kcal por debajo de mantenimiento). Bien.'};
  }
  if(state.goalType==='surplus'){
    if(diff<0) return {text:'Tu promedio (~'+Math.round(avg)+' kcal) está por debajo de tu meta de superávit. Puede costarte ganar el ritmo de masa que buscas.'};
    if(pct>0.15) return {text:'Tu superávit promedio está siendo más grande de lo planeado (~'+diff+' kcal por encima). Vigila que la ganancia de peso no sea demasiado rápida.'};
    return {text:'Vas en superávit de forma consistente (~'+diff+' kcal por encima de mantenimiento). Bien.'};
  }
  return {text: diff>0 ? 'Estás comiendo por encima de tu mantenimiento (~'+diff+' kcal de más en promedio).' : 'Estás comiendo por debajo de tu mantenimiento (~'+Math.abs(diff)+' kcal de menos en promedio).'};
}

/* ============ PROTEÍNA ============ */
function lastBodyWeightKg(){
  if(!state.bodyWeights.length) return null;
  const sorted = [...state.bodyWeights].sort((a,b)=>b.ts-a.ts);
  return sorted[0].weightKg;
}
function proteinTargetGrams(){
  const bw = lastBodyWeightKg();
  if(!bw) return null;
  return Math.round(bw*1.8); // punto medio del rango 1.6–2.2 g/kg para entrenamiento de fuerza
}
function dailyProteinTotals(){
  const totals = {};
  state.nutrition.forEach(n=>{ if(n.protein){ totals[n.date] = (totals[n.date]||0)+n.protein; } });
  return totals;
}
function proteinWeeklyStats(){
  const target = proteinTargetGrams();
  const totals = dailyProteinTotals();
  const dates = Object.keys(totals).sort();
  if(!dates.length) return {target, avg:null, diff:null};
  const last = dates.slice(-7);
  const avg = last.reduce((a,d)=>a+totals[d],0)/last.length;
  const diff = target!==null ? Math.round(avg-target) : null;
  return {target, avg: Math.round(avg), diff};
}

/* ============ PESO CORPORAL VS. META (cruce nutrición ↔ progreso) ============ */
function bodyweightGoalInsight(){
  if(!computeTargetCals()) return {text:'Configura tu meta nutricional en la pestaña Nutrición para comparar tu peso corporal contra tu objetivo.', status:'nodata'};
  const sorted = [...state.bodyWeights].sort((a,b)=>a.ts-b.ts);
  if(sorted.length<2) return {text:'Registra tu peso corporal al menos dos veces (con unos días de diferencia) para ver si va en línea con tu meta.', status:'nodata'};
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-21);
  const cutoffS = ymdFromDate(cutoff);
  const windowed = sorted.filter(b=>b.date>=cutoffS);
  const usable = windowed.length>=2 ? windowed : sorted;
  const first = usable[0], last = usable[usable.length-1];
  const days = Math.max(1, diffDays(first.date, last.date));
  const deltaKg = last.weightKg - first.weightKg;
  const deltaDisplay = fromKg(Math.abs(deltaKg), state.bwUnit);
  const dir = deltaKg > 0.3 ? 'up' : (deltaKg < -0.3 ? 'down' : 'flat');

  const goal = state.goalType;
  const aligned =
    (goal==='deficit' && dir==='down') ||
    (goal==='surplus' && dir==='up') ||
    (goal==='maintenance' && dir==='flat');

  const deltaTxt = fmt(deltaDisplay)+' '+state.bwUnit+' en '+days+' días';
  if(aligned){
    return {text:'Tu peso '+(dir==='flat'?'se ha mantenido estable':(dir==='down'?'bajó '+deltaTxt:'subió '+deltaTxt))+' — va en línea con tu meta de '+GOAL_LABELS[goal].toLowerCase()+'.', status:'ok'};
  }
  if(goal==='deficit'){
    return {text: dir==='up' ? 'Tu peso subió '+deltaTxt+' pese a estar en déficit. Tu estimado de mantenimiento probablemente está muy bajo — considera subirlo en Nutrición.' : 'Tu peso no ha bajado ('+ (dir==='flat'?'se mantuvo estable':'') +') en '+days+' días pese al déficit. Revisa tu estimado de mantenimiento.', status:'warn'};
  }
  if(goal==='surplus'){
    return {text: dir==='down' ? 'Tu peso bajó '+deltaTxt+' pese a estar en superávit. Tu estimado de mantenimiento probablemente está muy alto — considera bajarlo en Nutrición.' : 'Tu peso no ha subido en '+days+' días pese al superávit. Revisa tu estimado de mantenimiento.', status:'warn'};
  }
  return {text:'Tu peso se movió '+deltaTxt+' pese a buscar mantenimiento. Revisa tu estimado de calorías en Nutrición.', status:'warn'};
}

/* ============ PLATE VISUALIZER ============ */
function renderPlateViz(weightVal, unit){
  const w = parseFloat(weightVal);
  if(!w || isNaN(w) || w<=0) return '<div class="plate-empty">Ingresa un peso para ver cómo se vería cargado en una barra estándar.</div>';
  const plates = unit==='kg' ? [20,15,10,5,2.5,1.25] : [45,35,25,10,5,2.5];
  const bar = unit==='kg' ? 20 : 45;
  if(w<=bar) return '<div class="plate-empty">Peso menor o igual a la barra ('+bar+' '+unit+'). Ideal para mancuerna, polea o máquina.</div>';
  let remaining = (w-bar)/2;
  const used=[];
  for(const p of plates){ while(remaining >= p-0.01){ used.push(p); remaining-=p; } }
  const maxPlate = plates[0];
  let x=50, circles='';
  used.forEach(p=>{
    const r = 10 + (32-10)*(p/maxPlate);
    const color = interpColor('#5B8A9A','#E8623F', p/maxPlate);
    circles += '<circle cx="'+x+'" cy="60" r="'+r+'" fill="'+color+'" fill-opacity="0.92" stroke="#16161A" stroke-width="2"/>';
    x += 11;
  });
  const label = used.length ? used.map(p=>fmt(p)).join(' + ')+' '+unit+' por lado (barra '+bar+' '+unit+')' : '';
  return '<div class="plate-viz"><svg viewBox="0 0 '+(x+30)+' 120" width="100%" height="86">'+
    '<rect x="0" y="52" width="50" height="16" rx="2" fill="#8B8F98"/>'+circles+'</svg>'+
    '<div class="plate-label">'+label+'</div></div>';
}

  const colors = { deficit:'#5B8A9A', maintenance:'#8AA66B', surplus:'#E8623F' };

function renderTargetDisplay(){
  const target = computeTargetCals();
  if(!target) return '<div class="hint">Ingresa tus calorías de mantenimiento para calcular tu meta diaria.</div>';
  if(state.goalType==='maintenance') return '<div class="recommend-box"><b>Meta diaria.</b><br/>~'+target+' kcal (mantenimiento).</div>';
  const maint = Math.round(parseFloat(state.maintenanceCals));
  const diff = Math.abs(target-maint);
  const verb = state.goalType==='deficit' ? 'déficit' : 'superávit';
  return '<div class="recommend-box"><b>Meta diaria.</b><br/>~'+target+' kcal — un '+verb+' '+INTENSITY_LABELS[state.goalIntensity]+' de ~'+diff+' kcal frente a tu mantenimiento ('+maint+' kcal).</div>';

function addExercise(dayKey){
  const name = (state.newExName[dayKey]||'').trim();
  if(!name){ alert('Escribe el nombre del ejercicio.'); return; }
  const muscle = state.newExMuscle[dayKey] || 'Otro';
  if(state.routine[dayKey].exercises.some(e=>e.name.toLowerCase()===name.toLowerCase())){ alert('Ese ejercicio ya está en este día.'); return; }
  state.routine[dayKey].exercises.push({name, muscle});
  state.newExName[dayKey] = '';
  saveData(); renderApp();
}
function removeExercise(dayKey, name){
  if(!confirm('¿Quitar "'+name+'" de la rutina? Tus registros históricos de este ejercicio no se borran.')) return;
  state.routine[dayKey].exercises = state.routine[dayKey].exercises.filter(e=>e.name!==name);
  saveData(); renderApp();
}
function removeDay(dayKey){
  if(Object.keys(state.routine).length<=1){ alert('Debe quedar al menos un día en la rutina.'); return; }
  if(!confirm('¿Eliminar todo el día "'+state.routine[dayKey].label+'"? Tus registros históricos de ese día no se borran, solo deja de aparecer en el selector.')) return;
  delete state.routine[dayKey];
  if(state.logDay===dayKey) state.logDay = Object.keys(state.routine)[0];
  saveData(); renderApp();
}
function addNewDay(){
  const label = (state.newDayLabel||'').trim();
  if(!label){ alert('Escribe un nombre para el nuevo día.'); return; }
  const keys = Object.keys(state.routine).map(Number).filter(n=>!isNaN(n));
  const nextKey = String((keys.length?Math.max(...keys):0)+1);
  state.routine[nextKey] = { label, exercises: [] };
  state.newDayLabel = '';
  saveData(); renderApp();
}

    const ds = ymdFromDate(d);
    const cls = ['cal-day'];
    if(trainedDates.has(ds)) cls.push('trained');
    if(ds===todayS) cls.push('today');
    if(ds===state.calSelected) cls.push('selected');
    cells += '<div class="'+cls.join(' ')+'" onclick="selectCalDay(\''+ds+'\')">'+day+'</div>';
  }
  return ''+
  '<div class="cal-header">'+
    '<button class="cal-nav-btn" onclick="shiftMonth(-1)">‹</button>'+
    '<div class="cal-month">'+MESES[m]+' '+y+'</div>'+
    '<button class="cal-nav-btn" onclick="shiftMonth(1)">›</button>'+
  '</div>'+
  '<div class="cal-grid">'+DOW.map(d=>'<div class="cal-dow">'+d+'</div>').join('')+cells+'</div>'+
  '<div class="cal-legend"><span class="dot"></span> Día entrenado — toca un día para ver el detalle</div>';
}
function shiftMonth(delta){
  const d = new Date(state.calMonth); d.setMonth(d.getMonth()+delta); state.calMonth = d;
  renderApp();
}
function selectCalDay(ds){
  state.calSelected = state.calSelected===ds ? null : ds;
  renderApp();
}
function renderCalendarSelectedDay(){
  const sets = state.sets.filter(s=>s.date===state.calSelected).sort((a,b)=>a.ts-b.ts);
  const items = sets.length ? sets.map(s=>
    '<div class="session-item"><div class="session-main"><span class="ex">'+s.exercise+'</span><span class="chip">'+s.setType+'</span>'+
    '<div class="session-meta">'+fmt(fromKg(s.weightKg,state.displayUnit))+' '+state.displayUnit+' × '+s.reps+' reps</div></div></div>'
  ).join('') : '<div class="empty-state">Sin series registradas ese día.</div>';
  return '<div class="card"><div class="hint" style="margin-bottom:8px"><b>'+state.calSelected+'</b></div>'+items+'</div>';
}

/* ============ RENDER: HISTORY TAB ============ */
function renderHistoryTab(){
  const totalSets = state.sets.length;
  const trainedDays = new Set(state.sets.map(s=>s.date)).size;
  const streak = computeStreak();

  const byDate = {};
  state.sets.forEach(s=>{ (byDate[s.date] = byDate[s.date]||[]).push(s); });
  const dates = Object.keys(byDate).sort().reverse();

  const historyHtml = dates.length ? dates.map(d=>{
    const items = byDate[d].sort((a,b)=>a.ts-b.ts).map(s=>
      '<div class="session-item"><div class="session-main"><span class="ex">'+s.exercise+'</span><span class="chip">'+s.setType+'</span>'+
      '<div class="session-meta">'+fmt(fromKg(s.weightKg,state.displayUnit))+' '+state.displayUnit+' × '+s.reps+' reps'+(s.rpe?' · RPE '+s.rpe:'')+'</div></div>'+
      '<button class="del-btn" onclick="deleteSet(\''+s.id+'\')">×</button></div>'
    ).join('');
    return '<div class="history-day"><div class="history-day-label">'+d+' · '+(state.routine[byDate[d][0].day]?.label || ('Día '+byDate[d][0].day))+'</div><div class="card">'+items+'</div></div>';
  }).join('') : '<div class="empty-state">Aún no hay sesiones registradas.</div>';

  return ''+
  '<div class="section-title">Resumen</div>'+
  '<div class="stat-grid">'+
    '<div class="stat-card"><div class="stat-val">'+totalSets+'</div><div class="stat-lbl">Series totales</div></div>'+
    '<div class="stat-card"><div class="stat-val">'+trainedDays+'</div><div class="stat-lbl">Días entrenados</div></div>'+
    '<div class="stat-card"><div class="stat-val">'+streak+'</div><div class="stat-lbl">Racha actual</div></div>'+
  '</div>'+
  '<div class="section-title">Calendario</div>'+
  '<div class="card">'+renderCalendar()+'</div>'+
  (state.calSelected ? renderCalendarSelectedDay() : '')+
  '<div class="section-title">Historial de sesiones</div>'+
  historyHtml+
  '<div class="section-title">Respaldo de datos</div>'+
  '<div class="card">'+
    '<div class="hint">Tus datos se guardan solo en este celular. Exporta un respaldo de vez en cuando, o antes de cambiar de equipo, para no perderlos.</div><br/>'+
    '<div class="row">'+
      '<div class="field"><button class="btn btn-ghost" onclick="exportBackup()">↓ Exportar respaldo</button></div>'+
      '<div class="field"><button class="btn btn-ghost" onclick="triggerImport()">↑ Importar respaldo</button></div>'+
    '</div>'+
    '<input type="file" id="importFileInput" accept="application/json,.json" style="display:none" onchange="handleImportFile(this)">'+
  '</div>'+
  '<div class="hint" style="margin:18px 0 6px">Consejo: agrega esta página a tu pantalla de inicio para usarla como una app.</div>'+
  '<button class="btn btn-danger" onclick="resetAllData()">Borrar todos los datos</button>';
}
function exportBackup(){
  const data = { sets: state.sets, bodyWeights: state.bodyWeights, nutrition: state.nutrition, goalType:state.goalType, goalIntensity:state.goalIntensity, maintenanceCals:state.maintenanceCals, routine:state.routine, theme:state.theme, exportedAt: new Date().toISOString(), app:'FORJA' };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'forja-respaldo-'+todayStr()+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function triggerImport(){
  const input = document.getElementById('importFileInput');
  if(input) input.click();
}
function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ alert('No se pudo leer el archivo. Asegúrate de que sea un respaldo válido de FORJA (.json).'); input.value=''; return; }
    if(!data || !Array.isArray(data.sets)){ alert('Ese archivo no parece un respaldo válido de FORJA.'); input.value=''; return; }
    if(!confirm('Esto reemplazará tus datos actuales por los del respaldo ('+data.sets.length+' series). ¿Continuar?')){ input.value=''; return; }
    state.sets = data.sets||[];
    state.bodyWeights = data.bodyWeights||[];
    state.nutrition = data.nutrition||[];
    if(data.goalType) state.goalType = data.goalType;
    if(data.goalIntensity) state.goalIntensity = data.goalIntensity;
    if(data.maintenanceCals) state.maintenanceCals = data.maintenanceCals;
    if(data.routine) state.routine = data.routine;
    if(data.theme){ state.theme = data.theme; document.body.classList.toggle('light', state.theme==='light'); }
    saveData();
    renderApp();
    alert('Respaldo importado correctamente.');
    input.value='';
  };
  reader.readAsText(file);
}
function resetAllData(){
  if(!confirm('Esto borrará todos tus registros de forma permanente. ¿Continuar?')) return;
  state.sets=[]; state.bodyWeights=[]; state.nutrition=[];
  saveData(); renderApp();
}

/* ============ INIT ============ */
loadData();

</script>
</body>
</html>
